# Ephemeral benchmark task runners only. Agentsview itself is NOT containerized —
# it doesn't execute untrusted repo/build code, so there's no isolation reason to.
# Run it directly on the instance.
#
# Auth: subscription login (`claude login` on the host), not ANTHROPIC_API_KEY —
# deliberate choice to avoid per-token API spend. That means each ephemeral
# container needs the host's OAuth credential mounted in, read-only, rather
# than logging in itself (device-flow login can't run unsupervised per task).
# Confirmed path on this instance: ~/.claude/.credentials.json.
#
# Containers run as a non-root user (bench, UID 1000 — matches ec2-user on
# this instance) rather than root: `claude --dangerously-skip-permissions`
# refuses to run as root, and non-interactive `-p` mode has no human present
# to approve permission prompts otherwise. HOME=/home/bench inside the
# container, hence the mount targets below.
#
# Agentsview integration: NOT an HTTP endpoint — verified against upstream
# README, it works by watching local session-transcript directories
# (~/.claude/projects/ for Claude Code) and has no push/ingest API at all.
# The AGENTSVIEW_ENDPOINT env var from earlier did nothing; removed. Real
# fix: mount ~/.claude/projects writable (not read-only, unlike the
# credential file) so each container's session transcripts land where the
# host's Agentsview file-watcher can actually see them. Heads up: task
# containers using the same WORKDIR (/workspace) may get grouped under the
# same "project" key by Claude Code's own directory-hashing — check the
# Agentsview UI after a real batch to confirm sessions aren't colliding.

services:
  java-track:
    build:
      context: .
      dockerfile: images/java.Dockerfile
    volumes:
      - ./results:/results
      - ./results-agy:/results-agy
      - ${HOME}/.claude/.credentials.json:/home/bench/.claude/.credentials.json:ro
      - ${HOME}/.claude/projects:/home/bench/.claude/projects
      - ${HOME}/.gemini:/home/bench/.gemini
    mem_limit: 4g
    cpus: 2

  python-track:
    build:
      context: .
      dockerfile: images/python.Dockerfile
    volumes:
      - ./results:/results
      - ./results-agy:/results-agy
      - ${HOME}/.claude/.credentials.json:/home/bench/.claude/.credentials.json:ro
      - ${HOME}/.claude/projects:/home/bench/.claude/projects
      - ${HOME}/.gemini/antigravity-cli:/home/bench/.gemini/antigravity-cli
    mem_limit: 4g
    cpus: 2
