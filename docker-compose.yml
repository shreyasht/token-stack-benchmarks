# Ephemeral benchmark task runners only. Agentsview itself is NOT containerized —
# it doesn't execute untrusted repo/build code, so there's no isolation reason to.
# Run it directly on the instance and point these containers at it via
# host.docker.internal.
#
# `extra_hosts: host-gateway` is the Docker Compose mechanism for resolving
# host.docker.internal from inside a container; supported by Docker Engine on
# Linux (20.10+) the same way it is on Docker Desktop, so this works unchanged
# on an EC2 instance running plain Docker Engine.
#
# Auth: subscription login (`claude login` on the host), not ANTHROPIC_API_KEY —
# deliberate choice to avoid per-token API spend. That means each ephemeral
# container needs the host's OAuth credential mounted in, read-only, rather
# than logging in itself (device-flow login can't run unsupervised per task).
# Confirmed path on this instance: ~/.claude/.credentials.json.
# Containers run as root (no USER set in either Dockerfile) so HOME=/root.

services:
  java-track:
    build:
      context: .
      dockerfile: images/java.Dockerfile
    environment:
      - AGENTSVIEW_ENDPOINT=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./results:/results
      - ${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
    mem_limit: 4g
    cpus: 2

  python-track:
    build:
      context: .
      dockerfile: images/python.Dockerfile
    environment:
      - AGENTSVIEW_ENDPOINT=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./results:/results
      - ${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
    mem_limit: 4g
    cpus: 2
